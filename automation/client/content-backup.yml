name: Weekly content backup
on:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/content-backup.mjs --keep 12 # anon API only — no secrets
      - name: Commit the snapshot
        run: |
          git config user.name "store-bot"
          git config user.email "store-bot@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || (git commit -m "backup: content $(date -u +%F) [skip ci]" && git push)
