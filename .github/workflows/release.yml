name: Release template → update all clients
# Push mode: tag the template (git tag v1.8.0 && git push --tags) → full gate → GitHub release → every store listed in
# clients.json is cloned, updated with scripts/update-from-template.mjs, checked and pushed (its CDN redeploys).
# One secret, once, in THIS repo: CLIENTS_TOKEN = fine-grained PAT with Contents: read/write (+ Issues: write) on the
# client repositories. Nothing per client.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || echo "release exists"
  clients:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: template
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: cd template && npm ci --no-audit --no-fund
      - name: Update every client in clients.json
        env:
          CLIENTS_TOKEN: ${{ secrets.CLIENTS_TOKEN }}
        run: |
          if [ -z "$CLIENTS_TOKEN" ]; then
            echo "::error::CLIENTS_TOKEN secret is not set in this repository (Settings → Secrets → Actions). No client was updated."
            exit 1
          fi
          test -f template/clients.json || { echo "no clients.json — nothing to push"; exit 0; }
          git config --global user.name "store-bot"
          git config --global user.email "store-bot@users.noreply.github.com"
          failed=""
          for repo in $(node -e 'console.log(JSON.parse(require("fs").readFileSync("template/clients.json","utf8")).clients.map(c=>c.repo).join(" "))'); do
            echo "::group::$repo"
            rm -rf client
            if ! git clone --depth 1 "https://x-access-token:${CLIENTS_TOKEN}@github.com/${repo}.git" client; then
              echo "::error::$repo — cannot clone (does the repo exist? does CLIENTS_TOKEN cover it?)"; failed="$failed $repo"; echo "::endgroup::"; continue
            fi
            # Always run the TEMPLATE's updater: a client on an old version (e.g. 1.5.3) does not have the script yet.
            if ( cd client && node ../template/scripts/update-from-template.mjs --from ../template 2>&1 | tee ../out.txt; exit ${PIPESTATUS[0]} ); then
              if grep -q '^updated=true' out.txt; then
                version=$(grep '^version=' out.txt | tail -1 | cut -d= -f2)
                ( cd client && git add -A && git commit -m "template → ${version}" && git push ) || { echo "::error::$repo — push failed"; failed="$failed $repo"; }
                mig=$(grep '^migrations=' out.txt | tail -1 | cut -d= -f2-)
                if [ -n "$mig" ]; then GH_TOKEN="$CLIENTS_TOKEN" gh issue create -R "$repo" --title "Run database migrations for template ${version}" --body "New SQL files to run once in Supabase → SQL Editor: ${mig}" || echo "::warning::$repo — could not open the migrations issue (Issues permission?)"; fi
                echo "$repo → ${version} pushed"
              else
                echo "$repo already up to date"
              fi
            else
              echo "::error::$repo failed the update or its npm run check — nothing was pushed"; failed="$failed $repo"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::clients not updated:$failed"; exit 1; fi
