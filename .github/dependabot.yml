# Dependabot: security fixes always; routine bumps once a month, grouped into ONE pull request, and never a
# major version (majors of eslint / typescript / jsdom / pglite break the gates and need a human — see CHANGELOG).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
